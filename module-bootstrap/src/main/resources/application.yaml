spring:
  application:
    name: todakun
  jpa:
    # OSIV 비활성화 — 지연 로딩은 application 계층 트랜잭션 안에서 끝낸다.
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# 헬스 체크(Blue/Green) + Prometheus 메트릭 노출(/actuator/prometheus).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# 카카오/구글이 정한 고정 API 규격 — 환경(local/dev/prod) 무관하게 동일한 값.
oauth:
  kakao:
    user-me-uri: https://kapi.kakao.com/v2/user/me
  google:
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
    issuers:
      - https://accounts.google.com
      - accounts.google.com
