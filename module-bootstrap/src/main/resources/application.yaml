spring:
  application:
    name: todakun
  jpa:
    # OSIV 비활성화 — 지연 로딩은 application 계층 트랜잭션 안에서 끝낸다.
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

# 헬스 체크(Blue/Green) + Prometheus 메트릭 노출(/actuator/prometheus).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
