# local: 로컬 환경 (개발자 PC 직접 실행)
# 환경마다 달라지는 값(연결 정보·시크릿 포함)은 이 파일에 둔다. 시크릿은 .env로 주입.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update  # 자동 스키마 생성 사용
    properties:
      hibernate:
        format_sql: true
  batch:
    jdbc:
      initialize-schema: always  # Spring Batch 메타데이터 테이블 자동 생성(이미 있으면 스킵되는 멱등 동작)
  ai:
    vertex:
      ai:
        gemini:
          project-id: ${GCP_PROJECT_ID}
          location: ${VERTEX_AI_LOCATION}
          chat:
            options:
              model: ${VERTEX_AI_CHAT_MODEL}

# GCP Cloud Storage (raw 클라이언트). 로컬은 gcloud ADC(gcloud auth application-default login) 또는 키 파일로 인증.
gcp:
  project-id: ${GCP_PROJECT_ID}
  storage:
    bucket: ${GCS_BUCKET}

# FCM 푸시 알림(Firebase Admin SDK). ADC 인증(GCS와 공유). 로컬은 기본 비활성 → 필요 시 FCM_ENABLED=true.
fcm:
  enabled: ${FCM_ENABLED:false}   # false면 Firebase 빈 미생성(no-op) → 로컬 실행에 Firebase 불필요
  project-id: ${GCP_PROJECT_ID}   # Firebase 프로젝트 = GCP 프로젝트

# Sentry — DSN 미설정 시 자동 비활성(no-op). debug는 로컬 연동 점검용(전송 로그 출력).
sentry:
  dsn: ${SENTRY_DSN:}
  environment: local
  traces-sample-rate: 0
  debug: true

token:
  jwt:
    secret: ${JWT_SECRET}
    expiry-seconds: 604800  # 7일(액세스 토큰 만료시간)
  onboarding:
    expiry-seconds: 600  # 10분(온보딩 토큰 만료시간)
  redis:
    expiry-seconds: 2592000  # 30일(리프레시 토큰 만료시간)

oauth:
  google:
    client-ids: ${GOOGLE_OAUTH_CLIENT_IDS}  # 콤마 구분(Android/iOS 등 플랫폼별 클라이언트 ID)
  apple:
    client-ids: ${APPLE_CLIENT_IDS}  # 콤마 구분(여러 클라이언트 ID 지원 시)
    team-id: ${APPLE_TEAM_ID}
    key-id: ${APPLE_KEY_ID}
    private-key: ${APPLE_PRIVATE_KEY}

logging:
  level:
    com.yapp.todakun: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
