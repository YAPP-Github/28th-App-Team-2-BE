# local: 로컬 환경 (개발자 PC 직접 실행)
# 환경마다 달라지는 값(연결 정보·시크릿 포함)은 이 파일에 둔다. 시크릿은 .env로 주입.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# GCP Cloud Storage (raw 클라이언트). 로컬은 gcloud ADC(gcloud auth application-default login) 또는 키 파일로 인증.
gcp:
  project-id: ${GCP_PROJECT_ID}
  storage:
    bucket: ${GCS_BUCKET}

token:
  jwt:
    secret: ${JWT_SECRET}
    expiry-seconds: 604800  # 7일(엑세스 토큰 만료시간)
  redis:
    expiry-seconds: 2592000  # 30일(리프레시 토큰 만료시간)

logging:
  level:
    com.yapp.todakun: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
