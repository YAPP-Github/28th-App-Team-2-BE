# dev: 개발 환경 (개발 서버 배포 · 통합 테스트/QA)
# 환경마다 달라지는 값(연결 정보·시크릿 포함)은 이 파일에 둔다. 시크릿은 .env로 주입.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update  # 자동 스키마 생성 사용

# GCP Cloud Storage (raw 클라이언트). VM 서비스 계정 ADC로 인증 → 자격증명 env 불필요.
gcp:
  project-id: ${GCP_PROJECT_ID}
  storage:
    bucket: ${GCS_BUCKET}

# FCM 푸시 알림(Firebase Admin SDK). VM 서비스 계정 ADC로 인증 → 키 파일 불필요.
fcm:
  enabled: ${FCM_ENABLED:true}    # false면 Firebase 빈 미생성(no-op)
  project-id: ${GCP_PROJECT_ID}   # Firebase 프로젝트 = GCP 프로젝트

# Sentry(APM/에러 추적). DSN 미설정 시 비활성(no-op).
sentry:
  dsn: ${SENTRY_DSN:}
  environment: dev
  traces-sample-rate: 0.2

token:
  jwt:
    secret: ${JWT_SECRET}
    expiry-seconds: 604800  # 7일(엑세스 토큰 만료시간)
  redis:
    expiry-seconds: 2592000  # 30일(리프레시 토큰 만료시간)

oauth:
  google:
    client-ids: ${GOOGLE_OAUTH_CLIENT_IDS}  # 콤마 구분(Android/iOS 등 플랫폼별 클라이언트 ID)

logging:
  # 구조화 로그(JSON) → stdout → Alloy가 level 파싱 → Loki. Discord ERROR 알림의 기반.
  structured:
    format:
      console: logstash
  level:
    root: INFO
    com.yapp.todakun: DEBUG
