name: Deploy (dev)

# develop 푸시 또는 수동 실행 시:
#   build: 테스트(check) → bootJar → 이미지 GHCR 푸시
#   deploy: Ansible로 VM 프로비저닝(멱등) + Blue/Green 전환
on:
  push:
    branches: ["develop"]
  workflow_dispatch:

# 같은 VM 배포가 겹치지 않도록 직렬화(진행 중이면 대기, 취소하지 않음 → 배포 유실 방지).
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # GHCR 푸시 (GITHUB_TOKEN)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: dev
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle (develop push에서만 캐시 쓰기 — 그 외엔 읽기 전용)
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Verify (ktlint · architecture-test · test)
        run: ./gradlew check

      - name: Build bootJar
        run: ./gradlew :bootstrap:bootJar

      - name: Compute image ref (GHCR, owner 소문자)
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/todakun-app:dev-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${owner}/todakun-app:dev-latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        run: |
          docker build -f deploy/Dockerfile \
            -t "${{ steps.meta.outputs.image }}" \
            -t "${{ steps.meta.outputs.latest }}" .
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ steps.meta.outputs.latest }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up SSH key for Ansible
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # 호스트 키 검증 비활성화(HOST_KEY_CHECKING=False) 대신 known_hosts를 사전에 채워 MITM 방지.
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Render Ansible inventory
        working-directory: deploy/ansible
        run: |
          mkdir -p inventory/dev
          cat > inventory/dev/hosts.ini <<EOF
          [todakun_dev]
          ${{ secrets.VM_HOST }} ansible_user=${{ secrets.VM_USER }}

          [todakun_dev:vars]
          ansible_ssh_private_key_file=~/.ssh/id_deploy
          ansible_python_interpreter=/usr/bin/python3
          EOF

      - name: Install Ansible, collections & SOPS
        working-directory: deploy/ansible
        run: |
          pipx install --include-deps ansible
          ansible-galaxy collection install -r collections/requirements.yaml
          SOPS_VERSION=v3.9.1
          base="https://github.com/getsops/sops/releases/download/${SOPS_VERSION}"
          curl -fsSL -o sops "${base}/sops-${SOPS_VERSION}.linux.amd64"
          curl -fsSL -o sops.checksums.txt "${base}/sops-${SOPS_VERSION}.checksums.txt"
          # 릴리스 자산 변조/공급망 위험 방지 — 공식 체크섬과 대조 후에만 설치.
          expected=$(grep "sops-${SOPS_VERSION}.linux.amd64" sops.checksums.txt | awk '{print $1}')
          echo "${expected}  sops" | sha256sum -c -
          sudo install -m 0755 sops /usr/local/bin/sops
          rm -f sops sops.checksums.txt

      - name: Provision VM (idempotent)
        working-directory: deploy/ansible
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: ansible-playbook -i inventory/dev/hosts.ini playbook.yaml

      - name: Deploy (Blue/Green switch)
        working-directory: deploy/ansible
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: ansible-playbook -i inventory/dev/hosts.ini deploy.yaml
