name: Deploy (dev)

# develop 푸시 또는 수동 실행 시:
#   build:         테스트(check) → bootJar → arm64 이미지 GHCR 푸시
#   bump-manifest: GitOps 리포(Todakun/Todakun-GitOps) overlays/dev 이미지 태그 갱신
# 클러스터에는 접속하지 않는다 — 반영은 Argo CD가 Git을 당겨와 수행한다.
on:
  push:
    branches: ["develop"]
  workflow_dispatch:

# 같은 환경 배포가 겹치지 않도록 직렬화(진행 중이면 대기, 취소하지 않음).
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # GHCR 푸시 (GITHUB_TOKEN)

jobs:
  build:
    # OKE 노드가 aarch64 — x86 러너로 만든 amd64 이미지는 Pod에서 exec format error.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    environment: dev
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle (develop push에서만 캐시 쓰기 — 그 외엔 읽기 전용)
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Verify (ktlint · architecture-test · test)
        run: ./gradlew check

      - name: Build bootJar
        run: ./gradlew :bootstrap:bootJar

      - name: Compute image ref (GHCR, owner 소문자)
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/todakun-app:dev-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${owner}/todakun-app:dev-latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image (arm64 네이티브)
        run: |
          docker build -f deploy/Dockerfile \
            -t "${{ steps.meta.outputs.image }}" \
            -t "${{ steps.meta.outputs.latest }}" .
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ steps.meta.outputs.latest }}"

  bump-manifest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dev
    steps:
      # ★ 이 리포가 아니라 GitOps 리포를 체크아웃한다.
      #   GITHUB_TOKEN은 크로스 리포 쓰기가 안 되므로 전용 토큰이 필요하다.
      - name: Checkout GitOps repo (develop)
        uses: actions/checkout@v7
        with:
          repository: Todakun/Todakun-GitOps
          ref: develop
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          persist-credentials: true

      - name: Install kustomize (체크섬 검증)
        run: |
          KUSTOMIZE_VERSION=v5.8.1
          base="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}"
          curl -fsSL -o kustomize.tar.gz "${base}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o checksums.txt "${base}/checksums.txt"
          grep "kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" checksums.txt | awk '{print $1"  kustomize.tar.gz"}' | sha256sum -c -
          tar -xzf kustomize.tar.gz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          rm -f kustomize kustomize.tar.gz checksums.txt

      - name: Bump dev image tag
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          cd overlays/dev
          kustomize edit set image "todakun-app=${IMAGE}"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "매니페스트 변경 없음 — 스킵"
            exit 0
          fi
          git commit -am "chore: dev 이미지 태그 갱신 (${GITHUB_SHA:0:7})"
          # 앱 리포의 concurrency는 이 워크플로 실행만 직렬화한다 — 체크아웃 이후 GitOps 리포
          # develop에 다른 커밋(사람·다른 파이프라인)이 들어오면 push가 non-fast-forward로 실패한다.
          # rebase 후 최대 3회 재시도(태그 커밋은 rebase로 보존).
          for attempt in 1 2 3; do
            if git push origin develop; then
              exit 0
            fi
            echo "push 실패 — rebase 후 재시도 (${attempt}/3)"
            git pull --rebase origin develop
          done
          echo "::error::GitOps 리포 develop push를 3회 재시도했으나 실패했습니다."
          exit 1
