name: Deploy (prod)

# vX.Y.Z 태그 푸시 또는 수동 실행 시:
#   build:         테스트(check) → bootJar → arm64 이미지 GHCR 푸시 (태그 = 시맨틱 버전)
#   bump-manifest: GitOps 리포(Todakun/Todakun-GitOps) overlays/prod 이미지 태그 갱신
# 클러스터에는 접속하지 않는다 — Argo CD가 overlays/prod(main 브랜치)를 추적해 반영한다.
# 태그 푸시 자체가 릴리즈이므로 "태그를 먼저 달고 main에 push"하는 순서 의존이 없다.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "배포 이미지의 시맨틱 버전 (예: 1.0.0). 비우면 HEAD에 달린 git 태그(vX.Y.Z)에서 추출합니다."
        required: false

# 같은 환경 배포가 겹치지 않도록 직렬화(진행 중이면 대기, 취소하지 않음 → 배포 유실 방지).
concurrency:
  group: deploy-prod
  cancel-in-progress: false

# 워크플로 기본 권한은 최소로 두고, GHCR 푸시 권한은 실제로 필요한 build 잡에만 부여한다.
permissions:
  contents: read

jobs:
  build:
    # OKE 노드가 aarch64 — x86 러너로 만든 amd64 이미지는 Pod에서 exec format error.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    environment: prod
    permissions:
      contents: read
      packages: write # GHCR 푸시 (GITHUB_TOKEN)
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # git tag에서 버전을 추출하려면 태그 히스토리가 필요하다.

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle (릴리즈 태그 push에서만 캐시 쓰기 — 그 외엔 읽기 전용)
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Verify (ktlint · architecture-test · test)
        run: ./gradlew check

      - name: Build bootJar
        run: ./gradlew :bootstrap:bootJar

      - name: 릴리즈 버전 결정 (workflow_dispatch 입력 우선, 없으면 HEAD의 git 태그에서 추출)
        id: release
        # 수동 입력은 run 스크립트에 직접 보간하지 않고 env로 전달한다 —
        # `${{ ... }}`를 셸에 그대로 렌더링하면 입력에 담긴 셸 구문이 runner에서 실행된다(스크립트 인젝션).
        env:
          RELEASE_VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          version="$RELEASE_VERSION_INPUT"
          if [ -z "$version" ]; then
            version="$(git describe --tags --exact-match HEAD 2>/dev/null | sed 's/^v//')" || true
          fi
          if [ -z "$version" ]; then
            echo "::error::시맨틱 버전을 결정할 수 없습니다 — workflow_dispatch의 version 입력을 채우거나, HEAD 커밋에 vX.Y.Z 형식의 git 태그를 달아주세요."
            exit 1
          fi
          # 형식 검증 — 이 값이 뒤에서 이미지 태그로 쓰이므로 여기서 한 번 막아둔다.
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version은 X.Y.Z 형식이어야 합니다 (입력값: ${version})."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Compute image ref (GHCR, owner 소문자)
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/todakun-app:${{ steps.release.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${owner}/todakun-app:prod-latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image (arm64 네이티브)
        run: |
          docker build -f deploy/Dockerfile \
            -t "${{ steps.meta.outputs.image }}" \
            -t "${{ steps.meta.outputs.latest }}" .
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ steps.meta.outputs.latest }}"

  bump-manifest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    steps:
      # ★ 이 리포가 아니라 GitOps 리포를 체크아웃한다.
      #   GITHUB_TOKEN은 크로스 리포 쓰기가 안 되므로 전용 토큰이 필요하다.
      - name: Checkout GitOps repo (main)
        uses: actions/checkout@v7
        with:
          repository: Todakun/Todakun-GitOps
          ref: main
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          persist-credentials: true

      - name: Install kustomize (체크섬 검증)
        run: |
          KUSTOMIZE_VERSION=v5.8.1
          base="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}"
          curl -fsSL -o kustomize.tar.gz "${base}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o checksums.txt "${base}/checksums.txt"
          grep "kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" checksums.txt | awk '{print $1"  kustomize.tar.gz"}' | sha256sum -c -
          tar -xzf kustomize.tar.gz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          rm -f kustomize kustomize.tar.gz checksums.txt

      - name: Bump prod image tag
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          cd overlays/prod
          kustomize edit set image "todakun-app=${IMAGE}"

      - name: Commit & push
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "매니페스트 변경 없음 — 스킵"
            exit 0
          fi
          git commit -am "chore: prod 이미지 태그 갱신 (${VERSION})"
          # 앱 리포의 concurrency는 이 워크플로 실행만 직렬화한다 — 체크아웃 이후 GitOps 리포
          # main에 다른 커밋(사람·다른 파이프라인)이 들어오면 push가 non-fast-forward로 실패한다.
          # rebase 후 최대 3회 재시도(태그 커밋은 rebase로 보존).
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            echo "push 실패 — rebase 후 재시도 (${attempt}/3)"
            git pull --rebase origin main
          done
          echo "::error::GitOps 리포 main push를 3회 재시도했으나 실패했습니다."
          exit 1
