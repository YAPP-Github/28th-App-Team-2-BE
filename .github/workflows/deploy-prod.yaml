name: Deploy (prod)

# vX.Y.Z 태그 푸시 또는 수동 실행 시:
#   build: 테스트(check) → bootJar → 이미지 GHCR 푸시 (태그 = 시맨틱 버전)
#   deploy: Ansible로 VM 프로비저닝(멱등, target_group=todakun_prod) + Blue/Green 전환(prod 프로필)
# ⚠️ 기존 VM을 prod로 전환하는 배포다(신규 VM 아님). 상세 설계: docs/oke-migration-guide.md 10.2절.
# 태그 푸시 자체가 릴리즈이므로 "태그를 먼저 달고 main에 push"하는 순서 의존이 없다.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "배포 이미지의 시맨틱 버전 (예: 1.0.0). 비우면 HEAD에 달린 git 태그(vX.Y.Z)에서 추출합니다."
        required: false

# 같은 VM 배포가 겹치지 않도록 직렬화(진행 중이면 대기, 취소하지 않음 → 배포 유실 방지).
concurrency:
  group: deploy-prod
  cancel-in-progress: false

# 워크플로 기본 권한은 최소로 두고, GHCR 푸시 권한은 실제로 필요한 build 잡에만 부여한다.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: prod
    permissions:
      contents: read
      packages: write # GHCR 푸시 (GITHUB_TOKEN)
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # git tag에서 버전을 추출하려면 태그 히스토리가 필요하다.

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle (릴리즈 태그 push에서만 캐시 쓰기 — 그 외엔 읽기 전용)
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Verify (ktlint · architecture-test · test)
        run: ./gradlew check

      - name: Build bootJar
        run: ./gradlew :bootstrap:bootJar

      - name: 릴리즈 버전 결정 (workflow_dispatch 입력 우선, 없으면 HEAD의 git 태그에서 추출)
        id: release
        # 수동 입력은 run 스크립트에 직접 보간하지 않고 env로 전달한다 —
        # `${{ ... }}`를 셸에 그대로 렌더링하면 입력에 담긴 셸 구문이 runner에서 실행된다(스크립트 인젝션).
        env:
          RELEASE_VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          version="$RELEASE_VERSION_INPUT"
          if [ -z "$version" ]; then
            version="$(git describe --tags --exact-match HEAD 2>/dev/null | sed 's/^v//')" || true
          fi
          if [ -z "$version" ]; then
            echo "::error::시맨틱 버전을 결정할 수 없습니다 — workflow_dispatch의 version 입력을 채우거나, HEAD 커밋에 vX.Y.Z 형식의 git 태그를 달아주세요."
            exit 1
          fi
          # 형식 검증 — 이 값이 뒤에서 이미지 태그로 쓰이므로 여기서 한 번 막아둔다.
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version은 X.Y.Z 형식이어야 합니다 (입력값: ${version})."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Compute image ref (GHCR, owner 소문자)
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/todakun-app:${{ steps.release.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${owner}/todakun-app:prod-latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        run: |
          docker build -f deploy/Dockerfile \
            -t "${{ steps.meta.outputs.image }}" \
            -t "${{ steps.meta.outputs.latest }}" .
          docker push "${{ steps.meta.outputs.image }}"
          docker push "${{ steps.meta.outputs.latest }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up SSH key for Ansible
        # ssh-keyscan은 받은 키의 소유자를 검증하지 않는다 — 네트워크 공격자가 응답을 바꾸면
        # runner가 공격자 키를 신뢰하고 prod 배포 시크릿을 그쪽으로 보낼 수 있다.
        # 그래서 사전에 검증해 둔 호스트 키를 VM_KNOWN_HOSTS 시크릿에서 그대로 주입한다.
        env:
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -z "$VM_KNOWN_HOSTS" ]; then
            echo "::error::VM_KNOWN_HOSTS 시크릿이 비어 있습니다 — VM의 검증된 호스트 키를 등록해 주세요."
            exit 1
          fi
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Render Ansible inventory
        working-directory: deploy/ansible
        run: |
          mkdir -p inventory/prod
          cat > inventory/prod/hosts.ini <<EOF
          [todakun_prod]
          ${{ secrets.VM_HOST }} ansible_user=${{ secrets.VM_USER }}

          [todakun_prod:vars]
          ansible_ssh_private_key_file=~/.ssh/id_deploy
          ansible_python_interpreter=/usr/bin/python3
          EOF

      - name: Install Ansible, collections & SOPS
        working-directory: deploy/ansible
        run: |
          pipx install --include-deps ansible
          ansible-galaxy collection install -r collections/requirements.yaml
          SOPS_VERSION=v3.9.1
          base="https://github.com/getsops/sops/releases/download/${SOPS_VERSION}"
          curl -fsSL -o sops "${base}/sops-${SOPS_VERSION}.linux.amd64"
          curl -fsSL -o sops.checksums.txt "${base}/sops-${SOPS_VERSION}.checksums.txt"
          # 릴리스 자산 변조/공급망 위험 방지 — 공식 체크섬과 대조 후에만 설치.
          expected=$(grep "sops-${SOPS_VERSION}.linux.amd64" sops.checksums.txt | awk '{print $1}')
          echo "${expected}  sops" | sha256sum -c -
          sudo install -m 0755 sops /usr/local/bin/sops
          rm -f sops sops.checksums.txt

      - name: Provision VM (idempotent)
        working-directory: deploy/ansible
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: ansible-playbook -i inventory/prod/hosts.ini playbook.yaml -e target_group=todakun_prod

      - name: Deploy (Blue/Green switch)
        working-directory: deploy/ansible
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: ansible-playbook -i inventory/prod/hosts.ini deploy.yaml -e target_group=todakun_prod -e spring_profile=prod
