name: "📃 documentation"
description: 문서 작성 및 수정 이슈 템플릿
title: "[Docs] "
labels: ["📃 documentation"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## 📌 이슈 내용 설명
  - type: textarea
    id: description
    attributes:
      label: 설명
      description: 작성하거나 수정할 문서에 대해 설명해주세요.
      placeholder: 문서 작성 및 수정 내용을 자세히 설명해주세요.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## ✅ TODO
  - type: textarea
    id: todo
    attributes:
      label: 할 일 목록
      description: 문서 작성 및 수정을 위한 작업 목록을 작성해주세요.
      placeholder: |
        - [ ] 작업 1
        - [ ] 작업 2
    validations:
      required: true
