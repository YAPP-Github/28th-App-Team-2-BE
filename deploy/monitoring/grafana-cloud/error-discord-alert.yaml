# Grafana Cloud Alerting — ERROR 로그 → Discord 웹훅.
# Grafana Cloud는 관리형이라 로컬 provisioning 파일을 자동 로드하지 않는다.
# 이 파일은 (a) Grafana Alerting "Import"용 참고 스펙, 또는 (b) grafana Terraform provider로 코드화할 때의 기준이다.
# datasourceUid(<GC_LOKI_DATASOURCE_UID>)는 Grafana Cloud의 Loki 데이터소스 UID로 교체할 것.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord-errors
    receivers:
      - uid: discord-errors-receiver
        type: discord
        settings:
          # Grafana Cloud UI의 Contact point에 직접 Discord 웹훅 URL 입력을 권장(시크릿 관리).
          url: ${DISCORD_WEBHOOK_URL}
          message: |-
            **{{ .CommonLabels.alertname }}** ({{ .Status }})
            {{ range .Alerts }}{{ .Annotations.summary }}
            {{ end }}

policies:
  - orgId: 1
    receiver: discord-errors
    group_by: [alertname]
    group_wait: 30s
    group_interval: 1m
    repeat_interval: 1h

groups:
  - orgId: 1
    name: todakun-errors
    folder: Todakun
    interval: 1m
    rules:
      - uid: todakun-error-logs
        title: ERROR level logs detected
        condition: C
        for: 0m
        labels:
          severity: error
        annotations:
          summary: "todakun 앱에서 ERROR 로그 발생 (최근 5분)"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: <GC_LOKI_DATASOURCE_UID>
            model:
              refId: A
              datasource:
                type: loki
                uid: <GC_LOKI_DATASOURCE_UID>
              queryType: instant
              expr: 'sum(count_over_time({container=~"todakun-app-.*", level="ERROR"} [5m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]