# Blue/Green 배포 — GitHub Actions가 이미지 푸시 후 실행한다.
# 최신 deploy 산출물을 VM에 동기화한 뒤 switch.sh로 전환한다(헬스 체크·롤백은 switch.sh가 수행).
#   실행:  APP_IMAGE=<registry>/todakun/app:<tag> ansible-playbook -i inventory/dev/hosts.ini deploy.yaml
- name: Deploy todakun (Blue/Green switch)
  hosts: todakun_dev
  become: true
  vars:
    app_dir: /opt/todakun
    app_image: "{{ lookup('ansible.builtin.env', 'APP_IMAGE') }}"

  tasks:
    - name: APP_IMAGE 지정 확인
      ansible.builtin.assert:
        that: app_image | length > 0
        fail_msg: "APP_IMAGE 환경변수가 필요합니다."

    - name: 최신 deploy 산출물 동기화 (compose/caddy template/switch)
      ansible.builtin.copy:
        src: "../{{ item.src }}"
        dest: "{{ app_dir }}/{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - { src: "compose/docker-compose.app.yaml", dest: "compose/docker-compose.app.yaml", mode: "0644" }
        - { src: "caddy/Caddyfile.template", dest: "caddy/Caddyfile.template", mode: "0644" }
        - { src: "switch.sh", dest: "switch.sh", mode: "0755" }

    - name: SOPS 시크릿 → /opt/todakun/.env 갱신 (앱이 최신 시크릿으로 기동)
      ansible.builtin.import_tasks: tasks/render_env.yaml

    - name: 앱 이미지 pull (GHCR 인증 — --config로 config 디렉터리 명시)
      # provision이 /root/.docker/config.json에 GHCR 인증을 써 둔다. `docker --config`로
      # 그 디렉터리를 명시 지정해(become 시 HOME/DOCKER_CONFIG 전파 불확실성 제거) private
      # 앱 이미지를 여기서 미리 받아둔다. 이후 switch.sh는 로컬 이미지를 그대로 기동한다.
      ansible.builtin.command: docker --config /root/.docker pull {{ app_image }}
      register: app_pull
      changed_when: "'Downloaded newer image' in app_pull.stdout"

    - name: Blue/Green 전환 실행
      ansible.builtin.command: ./switch.sh
      args:
        chdir: "{{ app_dir }}"
      environment:
        APP_IMAGE: "{{ app_image }}"
      register: switch_result
      changed_when: true

    - name: switch.sh 출력
      ansible.builtin.debug:
        var: switch_result.stdout_lines
