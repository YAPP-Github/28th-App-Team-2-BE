# Blue/Green 배포 — GitHub Actions가 이미지 푸시 후 실행한다.
# 최신 deploy 산출물을 VM에 동기화한 뒤 switch.sh로 전환한다(헬스 체크·롤백은 switch.sh가 수행).
#   실행:  APP_IMAGE=<registry>/todakun/app:<tag> ansible-playbook -i inventory/dev/hosts.ini deploy.yaml
- name: Deploy todakun (Blue/Green switch)
  hosts: todakun_dev
  become: true
  vars:
    app_dir: /opt/todakun
    app_image: "{{ lookup('ansible.builtin.env', 'APP_IMAGE') }}"

  tasks:
    - name: APP_IMAGE 지정 확인
      ansible.builtin.assert:
        that: app_image | length > 0
        fail_msg: "APP_IMAGE 환경변수가 필요합니다."

    - name: 최신 deploy 산출물 동기화 (compose/caddy template/switch)
      ansible.builtin.copy:
        src: "../{{ item.src }}"
        dest: "{{ app_dir }}/{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - { src: "compose/docker-compose.app.yaml", dest: "compose/docker-compose.app.yaml", mode: "0644" }
        - { src: "caddy/Caddyfile.template", dest: "caddy/Caddyfile.template", mode: "0644" }
        - { src: "switch.sh", dest: "switch.sh", mode: "0755" }

    - name: SOPS 시크릿 → /opt/todakun/.env 갱신 (앱이 최신 시크릿으로 기동)
      ansible.builtin.import_tasks: tasks/render_env.yaml

    - name: GHCR 로그인 후 앱 이미지 pull (private 이미지)
      # switch.sh의 docker compose가 GHCR 인증을 못 써 registry denied로 실패하던 문제 해결.
      # --config /root/.docker로 명시 로그인(자격증명은 env로 전달 → 로그 미노출,
      # --password-stdin으로 argv 미노출) 후 이미지를 미리 받아둔다. 로그인은 plaintext
      # config.json에 저장돼 credential helper 경로를 타지 않는다(헤드리스 VM 안전).
      # 이후 switch.sh는 --pull never로 이 로컬 이미지를 그대로 기동한다.
      ansible.builtin.shell:
        cmd: |
          set -eu
          printf '%s' "$GHCR_PAT" | docker --config /root/.docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker --config /root/.docker pull "$APP_IMAGE"
      environment:
        GHCR_USER: "{{ ghcr_user }}"
        GHCR_PAT: "{{ ghcr_pat }}"
        APP_IMAGE: "{{ app_image }}"
      register: ghcr_pull
      changed_when: "'Downloaded newer image' in ghcr_pull.stdout"

    - name: Blue/Green 전환 실행
      ansible.builtin.command: ./switch.sh
      args:
        chdir: "{{ app_dir }}"
      environment:
        APP_IMAGE: "{{ app_image }}"
      register: switch_result
      changed_when: true

    - name: switch.sh 출력
      ansible.builtin.debug:
        var: switch_result.stdout_lines
