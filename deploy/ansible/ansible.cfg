[defaults]
inventory = inventory/dev
roles_path = roles
# community.sops vars 플러그인 활성화 → group_vars의 *.sops.yaml 자동 복호화.
# host_group_vars도 함께 명시해야 일반 group_vars 로딩이 유지된다.
vars_plugins_enabled = host_group_vars,community.sops.sops
host_key_checking = False

[community.sops]
# 인벤토리 로드 시점에 복호화 (group_vars가 그때 필요).
vars_stage = inventory

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
