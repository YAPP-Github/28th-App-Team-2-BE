# 상시 기동되는 공용 인프라: Caddy(리버스 프록시) + Redis.
# 앱 color(blue/green)는 docker-compose.app.yaml로 별도 기동하며 같은 외부 네트워크에 붙는다.
services:
  caddy:
    image: caddy:2-alpine
    container_name: todakun-caddy
    restart: unless-stopped
    # Caddyfile {$DOMAIN} 치환용(비밀 서브도메인은 .env에만). DOMAIN 미설정 시 Caddy 기동 실패하니 반드시 채울 것.
    # 인터넷에 노출되는 컨테이너이므로 전체 .env(앱 시크릿)를 상속하지 않고 DOMAIN만 전달한다.
    # ${DOMAIN}은 `docker compose --env-file .env`로 보간된다(Ansible playbook이 명시 지정).
    environment:
      - DOMAIN=${DOMAIN:?DOMAIN 환경변수가 필요합니다}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # caddy 디렉터리 전체를 한 번에 마운트한다. 내부 경로는 그대로:
      #   /etc/caddy/Caddyfile      switch.sh/Ansible이 렌더링한 설정
      #   /etc/caddy/certs/         Cloudflare Origin Certificate (커밋 금지)
      #   /etc/caddy/well-known/    딥링크 검증 파일(assetlinks.json / apple-app-site-association)
      #
      # ⚠️ 파일 단위(`../caddy/Caddyfile:/etc/caddy/Caddyfile`)로 마운트하면 안 된다.
      #   도커의 파일 bind 마운트는 경로가 아니라 inode에 묶인다. 그런데 Caddyfile을 쓰는 쪽은
      #   전부 임시 파일 → rename 방식이라(ansible.builtin.copy, sed -i) 쓸 때마다 inode가 회전하고,
      #   컨테이너는 옛 inode를 계속 보게 된다. 이때 `caddy reload`는 rc=0으로 성공하면서
      #   옛 설정을 적용하므로 배포는 success인데 트래픽만 깨진다(2026-08-18 dev 503 장애).
      #   디렉터리 마운트는 접근 시점에 경로를 해석하므로 inode 회전이 무해하다.
      #
      # :ro — Caddy는 /data(caddy-data)와 /config(caddy-config)에만 쓰고 /etc/caddy는 읽기만 한다.
      - ../caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - todakun-net

  redis:
    image: redis:7.2-alpine
    container_name: todakun-redis
    restart: unless-stopped
    # AOF 지속성 — VM 재시작 시 refresh token 유실 방지.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - todakun-net

volumes:
  caddy-data:
  caddy-config:
  redis-data:

networks:
  # `docker network create todakun-net`로 사전 생성(Ansible playbook이 처리).
  todakun-net:
    external: true
