# 앱 color 1개를 기동한다. COLOR/APP_IMAGE 환경변수로 blue/green을 구분.
#   COLOR=green APP_IMAGE=... docker compose -p todakun-green -f docker-compose.app.yaml up -d
# container_name을 color로 고정 → Caddy가 컨테이너명(todakun-app-blue|green)으로 프록시.
# 포트를 호스트에 노출하지 않는다 — 헬스 체크는 switch.sh가 일회성 curl 컨테이너로
# todakun-net 안에서 컨테이너명(todakun-app-blue|green:8080)에 직접 수행한다.
services:
  app:
    image: ${APP_IMAGE}
    container_name: todakun-app-${COLOR}
    restart: unless-stopped
    # application.yaml의 spring.lifecycle.timeout-per-shutdown-phase(130s, graceful shutdown 대기)보다
    # 20s 더 길게 둬 JVM이 자체적으로 정리를 마칠 여유를 준다. 기본 10s로는 switch.sh의
    # `docker compose down`이 진행 중인 chat 스트림을 SIGKILL로 끊을 수 있다.
    stop_grace_period: 150s
    # 앱 런타임 시크릿(DB/Redis/GCS). VM의 deploy/.env에서 주입.
    env_file:
      - ../.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      # Sentry 릴리즈 = 배포 이미지 태그(dev-<git sha>). Sentry가 이슈를 커밋 단위로 묶어 회귀 추적이 가능해진다.
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    networks:
      - todakun-net

networks:
  todakun-net:
    external: true
